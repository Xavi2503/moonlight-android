name: Build Artemis Mic BT

on:
  workflow_dispatch:
  push:
    branches:
      - artemis-mic-bt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare debug signing directory
        run: mkdir -p "$HOME/.android"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artemis-mic-bt-debug-keystore-v2

      - name: Create debug signing key on first v2 build
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Artemis Mic BT Debug,O=Artemis Mic BT,C=NL"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"

      - name: Build debug APKs
        run: ./gradlew assembleNonRoot_gameDebug --stacktrace

      - name: Collect and validate ARM64 APK
        shell: bash
        run: |
          mkdir -p artifact
          APK_PATH="app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-arm64-v8a-debug.apk"
          test -f "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK_PATH"
          cp "$APK_PATH" artifact/Artemis-Mic-BT-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Mic-BT-arm64
          path: artifact/Artemis-Mic-BT-arm64-v8a-debug.apk
          if-no-files-found: error
