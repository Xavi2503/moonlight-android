name: Build Artemis Mic BT

on:
  workflow_dispatch:
  push:
    branches:
      - artemis-mic-bt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build ARM64 debug APK
        run: ./gradlew assembleNonRoot_gameDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Collect ARM64 APK
        shell: bash
        run: |
          mkdir -p artifact
          find app/build/outputs/apk -type f -name '*arm64-v8a*debug*.apk' -exec cp {} artifact/Artemis-Mic-BT-arm64-v8a-debug.apk \;
          test -f artifact/Artemis-Mic-BT-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Mic-BT-arm64
          path: artifact/Artemis-Mic-BT-arm64-v8a-debug.apk
          if-no-files-found: error
