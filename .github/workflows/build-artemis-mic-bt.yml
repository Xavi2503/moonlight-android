name: Build Artemis Mic BT

on:
  workflow_dispatch:
  push:
    branches:
      - artemis-mic-bt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew assembleNonRoot_gameDebug --stacktrace

      - name: Collect and validate ARM64 APK
        shell: bash
        run: |
          mkdir -p artifact
          APK_PATH="app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-arm64-v8a-debug.apk"
          test -f "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK_PATH"
          cp "$APK_PATH" artifact/Artemis-Mic-BT-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Mic-BT-arm64
          path: artifact/Artemis-Mic-BT-arm64-v8a-debug.apk
          if-no-files-found: error
